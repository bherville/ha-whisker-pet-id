# Copy into a wide Home Assistant Sections column (recommended: section column_span: 2)
# for Smart Cat ID status, clean weight baselines with cat avatars, and paginated activity.
type: vertical-stack
grid_options:
  columns: full
cards:
  - type: custom:whisker-auto-pet-id-card
    title: Smart Cat ID
    entity: sensor.ha_whisker_pet_id_ai_pet_id_status
    page_size: 5
    max_rows: 25
  - type: entities
    title: Smart Cat ID Controls & Counts
    entities:
      - entity: sensor.ha_whisker_pet_id_ai_pet_id_status
        name: Smart Cat ID Mode
      - entity: sensor.ha_whisker_pet_id_flagged_visits
        name: Flagged Visits
      - entity: button.ha_whisker_pet_id_fix_pet_id_mismatches
        name: Fix Pet ID Mismatches
  - type: logbook
    title: Recent Smart Cat ID Activity
    hours_to_show: 72
    target:
      entity_id:
        - sensor.ha_whisker_pet_id_ai_pet_id_status
        - sensor.ha_whisker_pet_id_flagged_visits
