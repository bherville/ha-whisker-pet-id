get_pets:
  name: Get Whisker Pets
  description: List all Whisker pet profiles with baseline weights, tags, and recent weight history.
  fields:
    refresh:
      name: Refresh from Cloud
      description: Force a fresh GraphQL fetch of pet profiles and weight histories before returning.
      required: false
      default: false
      selector:
        boolean:

list_visits:
  name: List LR5 Visits
  description: Fetch recent Litter-Robot 5 activities, join matching Pet ID camera clips, and flag misattributions.
  fields:
    robot:
      name: Robot
      description: Optional Litter-Robot 5 name or serial (defaults to configured or sole LR5 unit).
      required: false
      example: "Laundry Room"
      selector:
        text:
    limit:
      name: Limit
      description: Maximum number of activity records to retrieve.
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 250
          mode: box
    offset:
      name: Offset
      description: Number of activity records to skip for pagination.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    activity_type:
      name: Activity Type
      description: Filter activity type (e.g. PET_VISIT, or empty string for all events).
      required: false
      default: "PET_VISIT"
      example: "PET_VISIT"
      selector:
        text:
    date:
      name: Date
      description: Optional YYYY-MM-DD local date filter for clips and visits.
      required: false
      example: "2026-11-24"
      selector:
        text:
    include_clips:
      name: Include Camera Clips
      description: Join matching LR5 Pro camera clips by event ID or timestamp proximity.
      required: false
      default: true
      selector:
        boolean:
    max_clip_delta_seconds:
      name: Max Clip Delta Seconds
      description: Maximum seconds between a visit timestamp and a camera clip timestamp to treat as a match.
      required: false
      default: 360
      selector:
        number:
          min: 10
          max: 1800
          mode: box

get_clip_urls:
  name: Get LR5 Clip URLs
  description: Exchange a recorded LR5 Pro clip ID for short-lived presigned S3 MP4 chunk URLs and HLS cookies.
  fields:
    clip_id:
      name: Clip ID
      description: The recorded camera clip ID from list_visits.
      required: true
      example: "123456"
      selector:
        text:
    robot:
      name: Robot
      description: Optional Litter-Robot 5 name or serial.
      required: false
      example: "Laundry Room"
      selector:
        text:

reassign_visit:
  name: Reassign LR5 Pet Visit
  description: Reassign, assign, or unassign a Litter-Robot 5 PET_VISIT event via Whisker's REST API.
  fields:
    event_id:
      name: Event ID
      description: The eventId of the PET_VISIT activity to modify.
      required: true
      example: "evt-12345"
      selector:
        text:
    from_pet:
      name: From Pet
      description: Name or petId currently assigned to the visit (provide alone to unassign, or with to_pet to reassign).
      required: false
      example: "Whiskers"
      selector:
        text:
    to_pet:
      name: To Pet
      description: Name or petId to assign the visit to (omit to unassign).
      required: false
      example: "Mittens"
      selector:
        text:
    robot:
      name: Robot
      description: Optional Litter-Robot 5 name or serial.
      required: false
      example: "Laundry Room"
      selector:
        text:
    refresh:
      name: Refresh Sensors
      description: Refresh Home Assistant's Litter-Robot and Pet ID coordinators after updating.
      required: false
      default: true
      selector:
        boolean:

generate_health_summary:
  name: Generate AI Pet Health Summary
  description: Generate household and per-cat Litter-Robot 5 health summaries using a configured Home Assistant AI Task with automatic deterministic fallback.
  fields:
    hours:
      name: Lookback Window (Hours)
      description: Number of hours of PET_VISIT telemetry to analyze (defaults to configured option).
      required: false
      example: 48
      selector:
        number:
          min: 12
          max: 168
          mode: box
    ai_task_entity:
      name: AI Task Entity
      description: Optional ai_task entity ID override (defaults to configured option, e.g. ai_task.my_ai_task).
      required: false
      example: "ai_task.my_ai_task"
      selector:
        entity:
          domain: ai_task
    use_ai:
      name: Use AI Task
      description: Use configured AI Task when available; if false, compute deterministic summary only.
      required: false
      default: true
      selector:
        boolean:
    notify:
      name: Send Push Notification
      description: Send the generated summary/alert to the configured or overridden notify service.
      required: false
      default: false
      selector:
        boolean:
    notify_service:
      name: Notify Service Override
      description: Optional notify service name(s), comma-separated (e.g. notify.mobile_app_phone).
      required: false
      example: "notify.mobile_app_phone"
      selector:
        text:
    robot:
      name: Robot
      description: Optional Litter-Robot 5 name or serial.
      required: false
      example: "Laundry Room"
      selector:
        text:

configure_health:
  name: Configure AI Health & Auto Pet ID Options
  description: Persist HA Whisker Pet ID robot selection, health summary schedule, AI Task entity, notify target, weight bounds, and Auto-Pet-ID options.
  fields:
    robot:
      name: Litter-Robot Unit
      description: Optional Litter-Robot 5 name or serial (leave empty to auto-select sole unit).
      required: false
      example: "Laundry Room"
      selector:
        text:
    ai_task_entity:
      name: AI Task Entity
      description: Home Assistant ai_task entity ID (e.g. ai_task.my_ai_task).
      required: false
      example: "ai_task.my_ai_task"
      selector:
        entity:
          domain: ai_task
    notify_service:
      name: Notify Service Target
      description: Home Assistant notify service name(s), comma-separated (e.g. notify.mobile_app_phone).
      required: false
      example: "notify.mobile_app_phone"
      selector:
        text:
    min_valid_weight_lbs:
      name: Minimum Valid Cat Weight (lb)
      description: Readings below this weight are treated as scale anomalies or partial entries.
      required: false
      selector:
        number:
          min: 1.0
          max: 10.0
          step: 0.5
          unit_of_measurement: lb
          mode: box
    max_valid_weight_lbs:
      name: Maximum Valid Cat Weight (lb)
      description: Readings at or above this weight are treated as scale anomalies or multi-cat entries.
      required: false
      selector:
        number:
          min: 10.0
          max: 40.0
          step: 0.5
          unit_of_measurement: lb
          mode: box
    weight_mismatch_lbs:
      name: Weight Mismatch Threshold (lb)
      description: Difference from a cat's baseline weight before flagging a visit as a mismatch.
      required: false
      selector:
        number:
          min: 0.25
          max: 5.0
          step: 0.05
          unit_of_measurement: lb
          mode: box
    enable_daily_summary:
      name: Enable Daily Summary
      description: Enable or disable the scheduled daily health summary.
      required: false
      selector:
        boolean:
    summary_hour:
      name: Daily Summary Hour
      description: Local hour (0-23) to run the daily health summary.
      required: false
      selector:
        number:
          min: 0
          max: 23
          mode: box
    summary_minute:
      name: Daily Summary Minute
      description: Local minute (0-59) to run the daily health summary.
      required: false
      selector:
        number:
          min: 0
          max: 59
          mode: box
    enable_push_alerts:
      name: Enable Push Alerts
      description: Enable or disable push notifications on daily summaries and repeat-visit clusters.
      required: false
      selector:
        boolean:
    health_window_hours:
      name: Lookback Window (Hours)
      description: Number of hours of PET_VISIT telemetry to analyze.
      required: false
      selector:
        number:
          min: 12
          max: 168
          mode: box
    cluster_window_minutes:
      name: Cluster Window (Minutes)
      description: Sliding window in minutes for detecting repeat visits.
      required: false
      selector:
        number:
          min: 5
          max: 60
          mode: box
    cluster_min_visits:
      name: Cluster Minimum Visits
      description: Minimum number of visits inside the window to flag a repeat-visit cluster.
      required: false
      selector:
        number:
          min: 2
          max: 10
          mode: box
    alert_cooldown_hours:
      name: Alert Cooldown (Hours)
      description: Minimum hours between repeat cluster notifications per cat.
      required: false
      selector:
        number:
          min: 1
          max: 48
          mode: box
    auto_pet_id_mode:
      name: Auto Pet ID Mode
      description: Automatic verification mode for flagged LR5 visits (off, dry_run, or auto_reassign).
      required: false
      example: "auto_reassign"
      selector:
        select:
          options:
            - "off"
            - "dry_run"
            - "auto_reassign"
    enable_hybrid_fast_path:
      name: Enable Hybrid Fast-Path
      description: Use 0-token weight reassignment when scale weight unambiguously separates one cat from all others.
      required: false
      selector:
        boolean:
    video_escalation:
      name: Video Escalation Mode
      description: Thumbnail only, or escalate to MP4 video chunks when AI Vision is uncertain.
      required: false
      example: "thumbnail_then_video"
      selector:
        select:
          options:
            - "thumbnail_only"
            - "thumbnail_then_video"
    auto_pet_id_min_confidence:
      name: Minimum Auto-Reassign Confidence
      description: Minimum AI confidence required for automatic reassignment (high or medium).
      required: false
      example: "high"
      selector:
        select:
          options:
            - "high"
            - "medium"
    auto_unassign_scale_glitches:
      name: Auto-Unassign Scale Glitches
      description: Automatically unassign scale anomalies below Minimum Valid Cat Weight without calling AI Vision.
      required: false
      selector:
        boolean:
    auto_pet_id_notify:
      name: Auto Pet ID Notification Policy
      description: When to push mobile notifications for Auto Pet ID checks (uncertain_only, all_actions, or none).
      required: false
      example: "uncertain_only"
      selector:
        select:
          options:
            - "uncertain_only"
            - "all_actions"
            - "none"
    auto_pet_id_max_per_run:
      name: Max Flagged Visits Per Run
      description: Maximum flagged visits processed per automatic cycle.
      required: false
      selector:
        number:
          min: 1
          max: 15
          mode: box
    auto_pet_id_clip_delay_seconds:
      name: Clip Upload Delay (Seconds)
      description: Seconds to wait after a visit before checking clips so LR5 camera upload completes.
      required: false
      selector:
        number:
          min: 30
          max: 300
          mode: box
    snapshot_camera_entity:
      name: Troubleshooting Snapshot Camera
      description: Optional Home Assistant camera entity to capture an extra room freeze-frame alongside LR5 thumbnails (leave empty to disable).
      required: false
      example: "camera.litter_room"
      selector:
        entity:
          domain: camera
    snapshot_max_files:
      name: Snapshot History Limit
      description: Maximum number of local snapshot JPEGs to keep before pruning oldest files.
      required: false
      selector:
        number:
          min: 10
          max: 500
          step: 10
          mode: box

verify_visits_with_ai:
  name: Verify Flagged Visits with AI Vision
  description: Evaluate recent flagged or specified LR5 visits using Hybrid Fast-Path + AI Vision (ai_task.generate_data) with optional dry-run or live reassignment.
  fields:
    event_id:
      name: Event ID
      description: Optional specific PET_VISIT eventId to verify (otherwise evaluates recent flagged visits).
      required: false
      example: "evt-12345"
      selector:
        text:
    dry_run:
      name: Dry Run
      description: If true, evaluate and log decisions without mutating Whisker; if omitted, uses configured Auto Pet ID Mode.
      required: false
      selector:
        boolean:
    limit:
      name: Max Visits
      description: Maximum number of flagged visits to evaluate in this run.
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 25
          mode: box
    video_escalation:
      name: Video Escalation Override
      description: Override thumbnail_only or thumbnail_then_video for this run.
      required: false
      selector:
        select:
          options:
            - "thumbnail_only"
            - "thumbnail_then_video"
    force:
      name: Force Re-evaluation
      description: Re-evaluate even if event_id was already processed or reassigned.
      required: false
      default: false
      selector:
        boolean:
    robot:
      name: Robot
      description: Optional Litter-Robot 5 name or serial.
      required: false
      example: "Laundry Room"
      selector:
        text:

get_alert_history:
  name: Get Historical Pet Alerts
  description: Query persistent HA Whisker Pet ID historical health clusters, summary watches/alerts, and Pet ID review alerts.
  fields:
    pet:
      name: Pet Name
      description: Filter alerts involving a specific pet (e.g. Luna).
      required: false
      example: "Luna"
      selector:
        text:
    days:
      name: Lookback Days
      description: Optional number of days back to include.
      required: false
      selector:
        number:
          min: 1
          max: 365
          mode: box
    severity:
      name: Severity
      description: Filter by severity (watch or alert).
      required: false
      selector:
        select:
          options:
            - "watch"
            - "alert"
    source:
      name: Alert Source
      description: Filter by alert source (health_cluster, health_summary, or pet_id_review).
      required: false
      selector:
        select:
          options:
            - "health_cluster"
            - "health_summary"
            - "pet_id_review"
    active_only:
      name: Active Alerts Only
      description: Return only currently unresolved alerts.
      required: false
      default: false
      selector:
        boolean:
    limit:
      name: Max Results
      description: Maximum number of alert records to return.
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 200
          mode: box
